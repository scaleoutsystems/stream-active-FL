# Streaming detection: gradient-norm-based filtering
# Accepts frames with the largest parameter gradient norms

# Paths
manifest_path: "data/Frames_1280x720/manifest.json"
output_dir: "outputs/streaming/gradient_norm_filter"

# Model
num_classes: 11
trainable_backbone_layers: 3
image_min_size: 720
image_max_size: 1280
pretrained_backbone: true
pretrained_detector: true
load_checkpoint: null

# Bootstrap phase (set bootstrap_run_dir to reuse a previous bootstrap)
bootstrap_run_dir: null
bootstrap_frames: 5000
bootstrap_epochs: 20
bootstrap_batch_size: 8
bootstrap_lr: 4.0e-4

# Streaming phase
streaming_lr: 1.0e-4
weight_decay: 1.0e-4
max_grad_norm: 1.0
buffer_capacity: 16
train_steps_per_buffer: 1

# Augmentation
augment: true
hflip_prob: 0.5
color_jitter: true

# Filtering
filter_policy: "gradient_norm"
accept_fraction: 0.3
warmup_items: 200
norm_window_size: 500

# Evaluation
eval_every_n_items: 5000
checkpoint_interval: 1000
score_threshold: 0.3
min_box_area: 64.0
bootstrap_smoke_check_frames: 200
bootstrap_smoke_score_threshold: 0.3
bootstrap_smoke_min_map50: 0.005
bootstrap_fail_on_smoke_check: true

# Reproducibility
seed: 42
device: "cuda"
