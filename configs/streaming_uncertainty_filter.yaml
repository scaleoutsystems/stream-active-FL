# Streaming detection: uncertainty-based filtering
# Accepts frames where the model's detection confidence is low

# Paths
manifest_path: "data/Frames_1600x480/manifest_temporal.json"
output_dir: "outputs/streaming/uncertainty_filter"

# Model / classes
num_classes: 11
target_classes: null  # null = all classes; or list e.g. ["Vehicle", "Pedestrian"]
trainable_backbone_layers: 3
image_min_size: 480
image_max_size: 1600
pretrained_backbone: true
pretrained_detector: true
load_checkpoint: null

# Bootstrap phase (set bootstrap_run_dir to reuse a previous bootstrap)
bootstrap_run_dir: null
bootstrap_frames: 2000
bootstrap_epochs: 20
bootstrap_batch_size: 8
bootstrap_lr: 4.0e-4

# Streaming phase
streaming_lr: 1.0e-4
weight_decay: 1.0e-4
max_grad_norm: 1.0
buffer_capacity: 16
train_steps_per_buffer: 1
buffer_training_mode: "full_batch"  # "full_batch" or "mini_batch"
local_epochs_per_buffer: 1
mini_batch_size: 8
shuffle_buffer_each_epoch: true

# Augmentation
augment: true
hflip_prob: 0.5
color_jitter: true

# Filtering
filter_policy: "uncertainty"
accept_fraction: 0.3
warmup_items: 200
score_window_size: 500
confidence_threshold: 0.1
top_k_detections: 5

# Evaluation
eval_every_n_items: 5000
checkpoint_interval: 1000
score_threshold: 0.3
min_box_area: 64.0
bootstrap_smoke_check_frames: 200
bootstrap_smoke_score_threshold: 0.3
bootstrap_smoke_min_map50: 0.005
bootstrap_fail_on_smoke_check: true

# Reproducibility
seed: 42
device: "cuda"
