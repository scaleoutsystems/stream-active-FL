# Federated adaptive Window filter (single reference) at threshold
# percentile 0.20 on the city-day curated stream.  Refresh every round:
# the scoring model is replaced with a snapshot of the post-aggregation
# global model and the reference is recomputed over the bootstrap plus
# the most recent fleet-pooled accepted frames (window of 1500).

manifest_path: "data/ZOD_frames_preprocessed/Frames_1600x480/manifest_cityday_curated_boot2000.json"
output_dir: "outputs/federated/fed_adaptive_window_p20_cityday_curated"

num_classes: 11
target_classes: ["Vehicle", "Pedestrian", "VulnerableVehicle"]
trainable_backbone_layers: 3
image_min_size: 480
image_max_size: 1600
pretrained_backbone: true
pretrained_detector: true
load_checkpoint: null

bootstrap_run_dir: null
bootstrap_frames: 2000
bootstrap_epochs: 20
bootstrap_batch_size: 8
bootstrap_lr: 4.0e-4

num_clients: 4
num_rounds: 30
local_items_per_round: 1000
partition_strategy: "domain_aligned"
domain_client_groups:
  - ["city_day_cloudy", "city_day_clear"]
  - ["city_day_rain_wet", "city_day_snow", "city_twilight", "city_night"]
  - ["arterial-urban_day", "arterial-urban_twi-night"]
  - ["highway_day", "highway_twi-night", "arterial-rural_day", "arterial-rural_twi-night", "smaller-rural_all"]

streaming_lr: 1.0e-4
weight_decay: 1.0e-4
max_grad_norm: 1.0
buffer_capacity: 32
train_steps_per_buffer: 1
buffer_training_mode: "mini_batch"
local_epochs_per_buffer: 2
mini_batch_size: 8
shuffle_buffer_each_epoch: true

augment: true
hflip_prob: 0.5
color_jitter: true

filter_policy: "distribution"
accept_fraction: 0.20
threshold_percentile: 0.20

scoring_refresh_every_rounds: 1
scoring_refresh_window_size: 1500
scoring_refresh_reservoir_size: 0
scoring_refresh_batch_size: 16
scoring_reference_mode: "single"
scoring_include_bootstrap: true

eval_every_n_rounds: 1
score_threshold: 0.3
min_box_area: 64.0
val_frame_limit: null
bootstrap_smoke_check_frames: 200
bootstrap_smoke_score_threshold: 0.3
bootstrap_smoke_min_map50: 0.005
bootstrap_fail_on_smoke_check: true

num_workers: 8
use_amp: true

seed: 42
device: "cuda"
