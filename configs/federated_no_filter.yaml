# Federated streaming detection (simulated FL with FedAvg)

# Paths
manifest_path: "data/Frames_1600x480/manifest.json"
output_dir: "outputs/federated/no_filter"

# Model
num_classes: 11
trainable_backbone_layers: 3
image_min_size: 480
image_max_size: 1600
pretrained_backbone: true
pretrained_detector: true
load_checkpoint: null

# Shared bootstrap (set bootstrap_run_dir to reuse)
bootstrap_run_dir: null
bootstrap_frames: 5000
bootstrap_epochs: 20
bootstrap_batch_size: 8
bootstrap_lr: 4.0e-4

# Federated setup
num_clients: 4
num_rounds: 10
local_items_per_round: 2000
# "uniform" currently aliases contiguous partitioning.
partition_strategy: "contiguous"

# Local streaming training
streaming_lr: 1.0e-4
weight_decay: 1.0e-4
max_grad_norm: 1.0
buffer_capacity: 16
train_steps_per_buffer: 1

# Augmentation
augment: true
hflip_prob: 0.5
color_jitter: true

# Filtering policy (per-client)
filter_policy: "none"
accept_fraction: 0.3
warmup_items: 200
score_window_size: 500
distribution_mode: "mahalanobis"
embedding_buffer_size: 1000
knn_k: 10
update_distribution_stats: true
confidence_threshold: 0.1
top_k_detections: 5
norm_window_size: 500

# Evaluation
eval_every_n_rounds: 1
score_threshold: 0.3
min_box_area: 64.0
val_frame_limit: null
bootstrap_smoke_check_frames: 200
bootstrap_smoke_score_threshold: 0.3
bootstrap_smoke_min_map50: 0.005
bootstrap_fail_on_smoke_check: true

# Reproducibility
seed: 42
device: "cuda"
