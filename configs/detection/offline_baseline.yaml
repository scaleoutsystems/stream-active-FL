# Offline baseline: multi-epoch shuffled training on all frames (performance ceiling)

# Paths
manifest_path: "data/Frames_1280x720/manifest.json"
output_dir: "outputs/offline_baseline"

# Model
num_classes: 11
trainable_backbone_layers: 3
image_min_size: 720
image_max_size: 1280
pretrained_backbone: true
pretrained_detector: true
load_checkpoint: null

# Training
epochs: 30
batch_size: 8
lr: 4.0e-4
weight_decay: 1.0e-4
max_grad_norm: 1.0
num_workers: 2
lr_scheduler: "cosine"
lr_warmup_epochs: 1

# Augmentation
augment: true
hflip_prob: 0.5
color_jitter: true

# Evaluation
eval_every_n_epochs: 1
score_threshold: 0.3
min_box_area: 64.0
bootstrap_smoke_check_frames: 200
bootstrap_smoke_score_threshold: 0.3
bootstrap_smoke_min_map50: 0.005
bootstrap_fail_on_smoke_check: true

# Reproducibility
seed: 42
device: "cuda"
