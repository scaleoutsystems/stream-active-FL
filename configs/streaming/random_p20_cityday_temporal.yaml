# Random-filter baseline, ~20% accept
# City-day bootstrap, temporal stream ordering

manifest_path: "data/ZOD_frames_preprocessed/Frames_1600x480/manifest_cityday_temporal_boot2000.json"
output_dir: "outputs/streaming/random_p20_cityday_temporal"

num_classes: 11
target_classes: ["Vehicle", "Pedestrian", "VulnerableVehicle"]
trainable_backbone_layers: 3
image_min_size: 480
image_max_size: 1600
pretrained_backbone: true
pretrained_detector: true
load_checkpoint: null

bootstrap_run_dir: null
bootstrap_frames: 2000
bootstrap_epochs: 20
bootstrap_batch_size: 8
bootstrap_lr: 4.0e-4

streaming_lr: 1.0e-4
weight_decay: 1.0e-4
max_grad_norm: 1.0
buffer_capacity: 32
train_steps_per_buffer: 1
buffer_training_mode: "mini_batch"
local_epochs_per_buffer: 2
mini_batch_size: 8
shuffle_buffer_each_epoch: true

streaming_lr_warmup_items: 1000
streaming_lr_min_factor: 0.1

augment: true
hflip_prob: 0.5
color_jitter: true

filter_policy: "random"
accept_fraction: 0.20

eval_every_n_items: 5000
checkpoint_interval: 1000
score_threshold: 0.3
min_box_area: 64.0
bootstrap_smoke_check_frames: 200
bootstrap_smoke_score_threshold: 0.3
bootstrap_smoke_min_map50: 0.005
bootstrap_fail_on_smoke_check: true

num_workers: 8
use_amp: true

seed: 42
device: "cuda"
