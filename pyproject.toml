[project]
name = "stream-active-fl"
version = "0.2.0"
description = "Continuous, Active Federated Learning for Data Streams"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "pillow",
    "tqdm",
    "pyyaml",
    "zod",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "experiments", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
pythonVersion = "3.10"
include = ["src", "experiments", "tests"]
extraPaths = ["src"]

[tool.basedpyright]
pythonVersion = "3.10"
include = ["src", "experiments", "tests"]
extraPaths = ["src"]
