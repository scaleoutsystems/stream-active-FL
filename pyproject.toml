[project]
name = "stream-active-fl"
version = "0.2.0"
description = "Continuous, Active Federated Learning for Data Streams"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pillow",
    "tqdm",
    "pyyaml",
    "zod",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
notebook = [
    "ipykernel",
    "matplotlib",
    "pandas",
]
local-torch = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "experiments", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.basedpyright]
pythonVersion = "3.10"
include = ["src", "experiments", "tests"]
extraPaths = [
    "src",
    # HPC module paths for IDE import resolution (ignored where absent)
    "/apps/USE/easybuild/staging/2023.1/software/PyTorch-bundle/2.1.2-foss-2023a-CUDA-12.1.1/lib/python3.11/site-packages",
    "/apps/USE/easybuild/staging/2023.1/software/PyTorch/2.1.2-foss-2023a-CUDA-12.1.1/lib/python3.11/site-packages",
    "/apps/USE/easybuild/staging/2023.1/software/Python-bundle-PyPI/2023.06-GCCcore-12.3.0/lib/python3.11/site-packages",
    "/apps/USE/easybuild/staging/2023.1/software/PyYAML/6.0-GCCcore-12.3.0/lib/python3.11/site-packages",
    "/apps/USE/easybuild/staging/2023.1/software/tqdm/4.66.1-GCCcore-12.3.0/lib/python3.11/site-packages",
    "/apps/USE/easybuild/staging/2023.1/software/SciPy-bundle/2023.07-gfbf-2023a/lib/python3.11/site-packages",
    "/apps/USE/easybuild/staging/2023.1/software/Pillow-SIMD/9.5.0-GCCcore-12.3.0/lib/python3.11/site-packages",
]
